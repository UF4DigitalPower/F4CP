[project]
name = "F4CP"
version = "3.0.1.A1"
# dev1    开发快照，最早期，不稳定
# a1       alpha 内测版，功能可能还没完整
# b1       beta 测试版，功能基本有了，但可能有 bug
# rc1      release candidate，候选正式版，接近正式发布
# 无后缀   正式版
description = "power management system"
readme = "README.md"
requires-python = ">=3.15"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
  { name = "UF4OVER", email = "heping@hepi.ng" }
]

dependencies = [
    "packaging>=24.2",
    "cx-freeze>=8.7",
    "PyQt5>=5.15.2",
    "pyqt-fluent-widgets>=1.11.2",
    "bleak>=2.0.0",
    "pyocd>=0.44",
]

[tool.uv]
system-certs = true
link-mode = "copy"
constraint-dependencies = [
    "pyqt5-qt5 >=5.15.2",
    "capstone >=5.0.2",
]


[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.cxfreeze]
executables = [
    { script = "start.py", base = "gui", target_name = "F4CP", icon = "src/assets/F4CP_ICO_256.ico" },
]

[tool.cxfreeze.build_exe]
build_exe = "build/exe"
includes = ["PyQt5.QtCore", "PyQt5.QtGui", "PyQt5.QtWidgets", "qfluentwidgets", "config"]
packages = ["config", "bleak", "winrt", "qfluentwidgets", "pyocd", "libusb_package", "cmsis_pack_manager", "lark", "pylink", "psutil"]
include_files = [
    ["pyproject.toml", "pyproject.toml"],
    ["LICENSE", "LICENSE"],
    ["src/assets", "src/assets"],
    ["src/font", "src/font"],
    ["src/theme", "src/theme"],
    ["src/config/profile.json", "src/config/profile.json"],
    ["src/tools/pack/UF4.STM32G4xx_DFP.2.2.0.pack", "src/tools/pack/UF4.STM32G4xx_DFP.2.2.0.pack"],
]
zip_include_packages = ["*"]
zip_exclude_packages = ["PyQt5", "qfluentwidgets", "bleak", "winrt", "pyocd", "libusb_package", "cmsis_pack_manager", "capstone", "lark", "psutil"]
excludes = ["tkinter", "matplotlib", "esptool", "pyqtgraph"]
optimize = 2
include_msvcr = true
